spec_version: "1.0"
language: "zh-CN"
purpose: "从合同、物流、保险、验收、费用和结算单据中识别名义贸易术语、实际履约画像、控制权转移证据和重大冲突；不得以单一费用字段替代综合判断。"

core_principles:
  - id: P01
    rule: "将贸易术语、买卖风险转移、会计控制权转移、承运人责任期间、实际付款人作为相互独立的判断维度。"
  - id: P02
    rule: "合同中的术语标签是名义术语；实际履约画像由有来源的事实字段形成。标签与画像不一致时输出‘修改/冲突’，不得静默改写为另一标准术语。"
  - id: P03
    rule: "费用‘已支付’、费用‘合同上应承担’、费用‘最终经济负担’分别存储。Freight Prepaid/Freight Collect 仅描述承运人端运费结算状态，不当然等同于买卖双方的最终经济负担。"
  - id: P04
    rule: "包装费、装箱/装柜费、码头操作费、装船费、主运费、保险费、目的港费用和进口税费必须拆分，不得统称为‘运费’。"
  - id: P05
    rule: "提单证明承运人接收或装船及承运人交付承诺；除非合同明确将该事件设为交付/控制权转移点，提单不能单独证明客户控制权已转移。"
  - id: P06
    rule: "存在签收或验收条件时，必须判断该文件是物流收讫、数量签收、质量验收、最终接受还是条件性接受；不得把所有签收单等同于最终验收。"
  - id: P07
    rule: "无法建立同一交易链（合同、订单、货物、箱号/提单号、金额、客户、日期）时，降低置信度并人工复核。"

incoterms_reference:
  required_contract_expression: "[术语] [准确命名地点/港口] Incoterms® [版本]"
  transport_mode_groups:
    any_mode: [EXW, FCA, CPT, CIP, DAP, DPU, DDP]
    sea_or_inland_waterway_only: [FAS, FOB, CFR, CIF]
  term_profiles:
    EXW:
      delivery_event: "货物在卖方场所或约定地点备妥供买方处置；卖方通常不负责装上买方车辆。"
      risk_event: "约定交付点备妥供处置时。"
      main_carriage_arranger: "买方"
      main_carriage_economic_burden: "买方"
      insurance_obligation: "买方；无卖方标准义务"
      export_formality: "买方（除合同另有约定）"
      import_formality: "买方"
    FCA:
      delivery_event: "在约定地点将货交买方指定承运人或其他人；若地点为卖方场所，卖方负责装车；若为其他地点，通常在货物交由承运人处置时交付。"
      risk_event: "交承运人/指定人时。"
      main_carriage_arranger: "买方"
      main_carriage_economic_burden: "买方"
      insurance_obligation: "买方；无卖方标准义务"
      export_formality: "卖方"
      import_formality: "买方"
    FAS:
      delivery_event: "在装运港将货物置于买方指定船舶旁。"
      risk_event: "靠船交付时。"
      main_carriage_arranger: "买方"
      main_carriage_economic_burden: "买方"
      insurance_obligation: "买方；无卖方标准义务"
      export_formality: "卖方"
      import_formality: "买方"
    FOB:
      delivery_event: "在装运港将货物装上买方指定船舶。"
      risk_event: "货物装上该船时。"
      main_carriage_arranger: "买方"
      main_carriage_economic_burden: "买方"
      insurance_obligation: "买方；无卖方标准义务"
      export_formality: "卖方"
      import_formality: "买方"
    CFR:
      delivery_event: "在装运港装船。"
      risk_event: "货物装船时。"
      main_carriage_arranger: "卖方"
      main_carriage_economic_burden: "卖方承担至目的港主运费"
      insurance_obligation: "买方；无卖方标准义务"
      export_formality: "卖方"
      import_formality: "买方"
    CIF:
      delivery_event: "在装运港装船。"
      risk_event: "货物装船时。"
      main_carriage_arranger: "卖方"
      main_carriage_economic_burden: "卖方承担至目的港主运费"
      insurance_obligation: "卖方为买方利益订立约定标准的货物保险"
      export_formality: "卖方"
      import_formality: "买方"
    CPT:
      delivery_event: "在约定交付地将货交承运人。"
      risk_event: "交第一承运人时。"
      main_carriage_arranger: "卖方"
      main_carriage_economic_burden: "卖方承担至约定目的地运费"
      insurance_obligation: "买方；无卖方标准义务"
      export_formality: "卖方"
      import_formality: "买方"
    CIP:
      delivery_event: "在约定交付地将货交承运人。"
      risk_event: "交第一承运人时。"
      main_carriage_arranger: "卖方"
      main_carriage_economic_burden: "卖方承担至约定目的地运费"
      insurance_obligation: "卖方为买方利益订立约定标准的货物保险"
      export_formality: "卖方"
      import_formality: "买方"
    DAP:
      delivery_event: "在约定目的地，货物在到达运输工具上、可供卸货时交付。"
      risk_event: "目的地到达运输工具上、可供卸货时。"
      main_carriage_arranger: "卖方"
      main_carriage_economic_burden: "卖方承担至约定目的地"
      insurance_obligation: "无当然义务；以合同为准"
      export_formality: "卖方"
      import_formality: "买方"
    DPU:
      delivery_event: "在约定目的地卸货后交付。"
      risk_event: "目的地卸货完成时。"
      main_carriage_arranger: "卖方"
      main_carriage_economic_burden: "卖方承担至约定目的地并承担卸货"
      insurance_obligation: "无当然义务；以合同为准"
      export_formality: "卖方"
      import_formality: "买方"
    DDP:
      delivery_event: "在约定目的地到达运输工具上、可供卸货时交付，且卖方已完成进口清关并承担进口税费。"
      risk_event: "目的地到达运输工具上、可供卸货时。"
      main_carriage_arranger: "卖方"
      main_carriage_economic_burden: "卖方承担至约定目的地"
      insurance_obligation: "无当然义务；以合同为准"
      export_formality: "卖方"
      import_formality: "卖方"

