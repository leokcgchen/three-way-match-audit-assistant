field_normalization:
  cost_categories:
    packaging: [包装费, 包装材料费, 打包费, 唛头费]
    stuffing: [装箱费, 装柜费, 装箱作业费, 装柜作业费, 理货费]
    inland_pre_carriage: [拖车费, 短驳费, 送港费, 内陆运输费]
    origin_terminal: [THC, 码头操作费, 港杂费, 起运港费用, 堆场费]
    loading: [装船费, 吊装费, 装载费]
    main_carriage: [海运费, 海运基本费, Ocean Freight, 运费]
    insurance: [海运保险费, 货运险保费, Cargo Insurance]
    destination_terminal: [目的港THC, 目的港费用, 卸货费, 拆箱费]
    import_clearance: [进口关税, 进口增值税, 清关费, 报关费]
    cleaning: [清洗费, 箱洗费, 集装箱清洗费, 舱清费]
  event_normalization:
    carrier_received: [已收货, 已进场, 货交承运人, received for shipment, received at terminal]
    loaded_on_board: [已装船, shipped on board, on board, 已装运]
    destination_arrived: [到港, 到站, arrived]
    delivered_unloaded: [已卸货交付, delivery after unloading]
    received_by_customer: [客户签收, 收货确认, POD]
    accepted_by_customer: [验收合格, 最终验收, final acceptance]

facts_and_evidence:
  evidence_classes:
    contract_obligation:
      examples: ["主合同、订单、书面补充协议、双方确认的变更单"]
      default_weight: 5
    third_party_carriage_event:
      examples: ["承运人提单、海运单、订舱确认、承运人账单"]
      default_weight: 5
    third_party_insurance:
      examples: ["保险单、保险凭证、保险公司账单"]
      default_weight: 5
    customer_acceptance:
      examples: ["客户签收、客户验收、客户拒收/索赔通知"]
      default_weight: 5
    customs_or_port:
      examples: ["报关单、港口/码头记录"]
      default_weight: 4
    financial_settlement:
      examples: ["付款流水、供应商发票、借贷项通知单、费用重收费发票"]
      default_weight: 4
    internal_record:
      examples: ["出库单、内部物流单、ERP字段"]
      default_weight: 2
    oral_or_unverified_statement:
      examples: ["无签字邮件截屏、口头说明、缺少来源的系统备注"]
      default_weight: 1
  source_quality_modifiers:
    signed_and_date_consistent: 1.0
    third_party_issued: 1.0
    directly_linked_to_transaction: 1.0
    unsigned_or_partial: 0.6
    OCR_low_confidence: 0.5
    entity_or_goods_mismatch: 0.2
    tamper_or_inconsistency: 0.0

classification_logic:
  preconditions:
    - "至少取得销售合同/订单或经双方确认的交易条款；否则不得输出标准术语的高置信结论。"
    - "建立交易匹配：至少两个强键（如合同号、提单号、箱号、订单号）或‘双方主体+货物+数量+时间窗口’的高相似度匹配。"
  procedure:
    - step: 1
      action: "抽取名义术语、命名地点/港口及 Incoterms 版本。"
    - step: 2
      action: "分别建立六类事实：交付事件、风险承担、主运安排与费用、保险、进出口手续、客户接收/验收。"
    - step: 3
      action: "识别文档中的费用分类、合同义务方、实际付款方和最终经济负担；保留三者差异。"
    - step: 4
      action: "按术语标准画像比对每一关键维度，并标记 consistent / modified / conflict / unknown。"
    - step: 5
      action: "单独根据合同、提单/承运人事件、签收/验收及退换货条件，评估会计控制权转移候选时点。"
    - step: 6
      action: "输出名义术语、实际履约画像、术语一致性、控制权转移结论、运输活动发生在控制权转移前/后及人工复核事项。"
  hard_stop_conditions:
    - "术语仅写 FOB/CIF 等，但未写命名港口/地点或版本，且无其他文件补足。"
    - "关键文件主体、箱号/提单号、货物或数量无法与合同匹配。"
    - "存在相互矛盾的书面补充协议且无法确定生效顺序。"
    - "客户签收仅为物流代收，且合同约定最终验收为控制权条件，但缺少最终验收文件。"
    - "合同、提单和费用/保险证据出现重大冲突，且无变更单、重收费或结算证据解释。"

term_tests:
  FOB:
    applicability: "仅海运/内河水运；集装箱货如仅交至堆场/承运人而非实际装船，触发 FCA 或非标准FOB复核。"
    required_standard_indicators:
      - "卖方在装运港装上买方指定船舶。"
      - "买方指定/订立主运输；合同义务上由买方承担主运费。"
      - "风险/交付点为装上船。"
      - "卖方办理出口手续。"
    non_dispositive_cost_exceptions:
      - "卖方承担正常包装、标记、出口前备货成本，不单独否定 FOB。"
      - "卖方实际代付主运费但有客户重收费、借项通知单、明确代垫约定或客户最终承担证据，应标为‘FOB—代垫/修改’，而非直接改判 CFR。"
      - "装箱费必须先拆分为包装、装柜、起运港堆场、装船或主运相关费用；不同子项的含义不同。"
    major_conflict_indicators:
      - "卖方根据买卖合同自行订立并最终承担至目的港主运费，且无客户重收费或代垫说明。"
      - "卖方被明确要求为买方利益安排货运保险，且卖方承担主运费，画像接近 CIF。"
      - "风险或拒收权持续至目的港/客户验收，而合同同时没有清晰的独立运输服务安排。"
  CFR:
    applicability: "仅海运/内河水运。"
    required_standard_indicators:
      - "卖方安排并承担至命名目的港的主运费。"
      - "货物装上船时交付/风险转移。"
      - "买方没有由卖方安排的标准货运保险保障。"
    conflict_indicators:
      - "风险被明确约定在目的港或客户签收/验收才转移。"
      - "主运输由买方安排且卖方未承担该费用。"
  CIF:
    applicability: "仅海运/内河水运。"
    required_standard_indicators:
      - "满足 CFR 的主运输特征。"
      - "卖方为买方利益订立货物保险；保险单/凭证中的被保险人、受益人、索赔权或可转让安排支持该结论。"
      - "货物装上船时交付/风险转移。"
    caution:
      - "卖方自行投保并不自动等于 CIF；应核实保险是否为买方利益、是否系合同义务、是否覆盖本票货物及从装运港至目的港航程。"
  FCA:
    applicability: "任意运输方式；集装箱货交承运人/码头通常优先考虑。"
    required_standard_indicators:
      - "货物在约定地点交给买方指定承运人/指定人。"
      - "买方安排主运输。"
      - "出口手续由卖方完成。"
  CPT_CIP:
    applicability: "任意运输方式。"
    required_standard_indicators:
      - "卖方安排并承担至命名目的地的运费。"
      - "风险在交第一承运人时转移。"
    distinction:
      CPT: "无卖方标准保险义务。"
      CIP: "卖方为买方利益安排保险。"
  DAP_DPU_DDP:
    applicability: "任意运输方式。"
    delivery_distinction:
      DAP: "目的地到达运输工具上、可供卸货。"
      DPU: "目的地卸货后。"
      DDP: "目的地到达运输工具上、可供卸货，且卖方完成进口清关并承担进口税费。"

cost_interpretation_rules:
  - id: C01
    when: "仅发现卖方支付包装费或通常包装成本。"
    outcome: "不作为否定 FOB/FCA/FAS 的证据；记录为正常卖方义务或成本，除非合同另有相反明确约定。"
  - id: C02
    when: "仅发现账单显示 Freight Prepaid。"
    outcome: "记录为承运人端结算状态；继续查合同义务方、付款人、客户重收费、借项通知单和最终负担。"
  - id: C03
    when: "卖方付款海运费，但合同写 FOB。"
    outcome: "先查‘代垫/应客户要求订舱/客户报销/运费包含价款/变更单’。有充分代垫或重收费证据，输出 modified_FOB；无此证据且卖方最终承担，输出 FOB重大冲突并标记 CFR_like_profile。"
  - id: C04
    when: "卖方付款保险费，但合同写 FOB/CFR。"
    outcome: "核实保单的 insured/assured、beneficiary/loss payee、claim right、航程和合同保险义务；仅为卖方自身利益的保险不自动改判 CIF。"
  - id: C05
    when: "卖方承担目的港卸货/目的地派送费。"
    outcome: "与 FOB/FAS/CFR/CIF 的标准画像存在强冲突；进一步判断是否 DAP/DPU/DDP 或附加物流服务。"
  - id: C06
    when: "‘装箱费’文本不明确。"
    outcome: "必须分类为 packaging、container_stuffing、origin_terminal、loading、main_carriage 或 destination_unstuffing；分类不明时人工复核。"
  - id: C07
    when: "‘清洗费’文本不明确。"
    outcome: "必须识别为货物/集装箱/舱位清洗、发生地点、发生时点、合同义务方、付款方和是否重收费；不以该单项费用独立改变术语。"

control_transfer_assessment:
  objective: "为收入确认提供候选事实结论，而非直接由 Incoterm 决定。"
  indicators:
    current_right_to_payment: "卖方是否对已交付货物有现时收款权。"
    legal_title: "所有权/物权条款是否已转移。"
    physical_possession: "客户或其指定方是否已取得实物占有。"
    significant_risks_and_rewards: "毁损、滞期、仓储、价格、拒收、退换货、保险索赔风险由谁承担。"
    customer_acceptance: "客户是否已完成合同规定的接受/验收，或验收仅属形式性。"
  output_values: [before_carriage, at_carrier_handover, at_on_board, at_destination_arrival, at_customer_receipt, at_final_acceptance, unresolved]
  transport_service_classification:
    before_control_transfer: "运输通常为履行销售合同的必要活动，不当然构成单项履约义务。"
    after_control_transfer: "运输可能构成向客户提供的单项运输服务；仍需判断是否可明确区分以及卖方是否为主要责任人。"
    unresolved: "缺少足够证据，不给出会计结论。"

conflict_resolution:
  dimension_specific_precedence:
    commercial_obligation: ["双方签署的最新补充协议", "主合同/订单", "双方确认的变更通知", "交易发票/结算单", "往来邮件", "内部记录"]
    carrier_event: ["承运人已装船提单/海运单", "承运人订舱确认/跟踪记录", "港口/码头记录", "货代单据", "内部出库单"]
    insurance_arrangement: ["保险单/保险凭证", "保险公司账单", "合同保险条款", "付款记录", "内部记录"]
    customer_acceptance: ["合同约定的最终验收证书", "客户盖章/签字的验收单", "客户签收/POD", "第三方物流POD", "内部交付记录"]
    economic_burden: ["合同义务与价格条款", "重收费/借贷项通知单", "付款及回款流水", "承运人账单", "内部成本归集"]
  rule: "同一维度内以更高优先级为主；不同维度不互相覆盖。出现不可解释冲突时，输出 conflict 并列明缺少的消歧文件。"

confidence_policy:
  high: "关键交付/风险/主运费/保险/验收维度均有相互印证的合同和第三方或客户证据，且无重大冲突。"
  medium: "核心维度可判断，但存在一项非核心缺失、金额不一致或需说明的代垫安排。"
  low: "仅有合同标签或内部记录；存在关键单据缺失、主体不匹配或签收/验收性质不清。"
  no_conclusion: "触发 hard_stop_conditions 或关键冲突未消除。"

